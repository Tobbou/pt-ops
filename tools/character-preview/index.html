<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PT Ops character preview</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0d1117;
        color: #e8eef5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .panel {
        position: fixed;
        left: 16px;
        top: 16px;
        background: rgba(21, 27, 35, 0.92);
        border: 1px solid #29323f;
        border-radius: 14px;
        padding: 14px 16px;
        max-width: 320px;
        backdrop-filter: blur(10px);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      p {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: #8f9dae;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 12px;
      }
      label {
        color: #8f9dae;
        min-width: 62px;
      }
      input[type='range'] {
        flex: 1;
        accent-color: #9dbb3a;
      }
      .stat {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #66738a;
        font-weight: 700;
      }
      button {
        background: #1b232d;
        color: #e8eef5;
        border: 1px solid #29323f;
        border-radius: 9px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.on {
        background: #9dbb3a;
        border-color: #9dbb3a;
        color: #10160b;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="panel">
      <h1>Character preview</h1>
      <p>Drag to orbit, scroll to zoom, right-drag to pan. This is the exact GLB the app would ship.</p>
      <div class="row">
        <label for="light">Light</label>
        <input id="light" type="range" min="0.2" max="3" step="0.1" value="1.6" />
      </div>
      <div class="row">
        <button id="spin" class="on">Turntable</button>
        <button id="bg">Stage: dark</button>
      </div>
      <div class="stat" id="stat">loading…</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
